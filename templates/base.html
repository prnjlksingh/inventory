<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inventory MVP</title>
    <style>
      :root {
        --bg: #f6f8fc;
        --card: #ffffff;
        --text: #1f2a44;
        --muted: #667085;
        --primary: #3563e9;
        --danger: #c62828;
        --success: #1f8a4c;
        --border: #e2e8f0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
      nav {
        background: #0f172a;
        color: #fff;
        padding: 1.25rem 1rem;
      }
      nav h1 { margin: 0 0 1rem 0; font-size: 1.1rem; }
      nav a {
        display: block;
        color: #cbd5e1;
        text-decoration: none;
        padding: 0.55rem 0.65rem;
        border-radius: 8px;
        margin-bottom: 0.35rem;
      }
      nav a:hover, nav a.active { background: #1e293b; color: #fff; }
      main { padding: 1.25rem; }
      .page-title { margin-top: 0; margin-bottom: 1rem; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.8rem; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.9rem;
      }
      .metric { font-size: 1.4rem; font-weight: 700; margin-top: 0.35rem; }
      .muted { color: var(--muted); font-size: 0.9rem; }
      .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 999px; font-size: 0.78rem; }
      .badge.success { background: #e6f6ec; color: var(--success); }
      .badge.warn { background: #fff4e5; color: #a35a00; }
      .badge.danger { background: #fdecec; color: var(--danger); }
      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
        margin-top: 1rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.93rem;
      }
      th, td {
        text-align: left;
        border-bottom: 1px solid var(--border);
        padding: 0.55rem;
        vertical-align: top;
      }
      form.inline, .grid-2 {
        display: grid;
        gap: 0.6rem;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }
      label { display: block; font-size: 0.87rem; color: var(--muted); margin-bottom: 0.2rem; }
      input, select, textarea, button {
        width: 100%;
        padding: 0.52rem 0.6rem;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font: inherit;
      }
      textarea { min-height: 80px; }
      button { background: var(--primary); color: #fff; border: 0; cursor: pointer; }
      button.secondary { background: #334155; }
      .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .flash { border-radius: 8px; padding: 0.65rem 0.75rem; margin-bottom: 0.75rem; font-size: 0.9rem; }
      .flash.success { background: #e8f8ef; color: #19673a; border: 1px solid #bde7cd; }
      .flash.error { background: #fdecee; color: #991b1b; border: 1px solid #f6c5c9; }
      .empty { color: var(--muted); font-style: italic; }
      @media (max-width: 860px) {
        .layout { grid-template-columns: 1fr; }
        nav { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
        nav h1 { width: 100%; margin-bottom: 0.4rem; }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <nav aria-label="Main navigation">
        <h1>Inventory MVP</h1>
        <a class="{{ 'active' if request.path == '/' else '' }}" href="{{ url_for('dashboard') }}">Dashboard</a>
        <a class="{{ 'active' if request.path.startswith('/inventory') else '' }}" href="{{ url_for('inventory_list') }}">Inventory</a>
        <a class="{{ 'active' if request.path.startswith('/students') else '' }}" href="{{ url_for('students_list') }}">Students</a>
        <a class="{{ 'active' if request.path.startswith('/transactions') else '' }}" href="{{ url_for('transactions') }}">Issue & Return</a>
        <a class="{{ 'active' if request.path.startswith('/due') else '' }}" href="{{ url_for('due_items') }}">Due View</a>
        <a class="{{ 'active' if request.path.startswith('/history') else '' }}" href="{{ url_for('history') }}">History</a>
      </nav>
      <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="flash {{ category }}" role="alert">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
